<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeekFusion Giveaway · OBS Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;color:#fff4fa;font-family:Arial,system-ui,sans-serif}
.card[hidden]{display:none}.card{margin:8px;padding:13px 16px;width:calc(100% - 16px);max-width:404px;border:1px solid #e28ab1;border-top:3px solid #ff9bbf;border-radius:13px;background:radial-gradient(ellipse at top right,#6f2850 0,transparent 72%),#25162c;box-shadow:0 2px 7px #120718a0}
h1{font-size:29px;letter-spacing:-.045em;line-height:1.05;margin:0;font-style:italic}
h2{font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:12px 0 0;color:#ffc6d9}.link,.empty{font-size:14px;margin:6px 0 0;color:#ffd29e}.empty[hidden]{display:none}ol{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:4px}ol[hidden]{display:none}
li{display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:7px;align-items:center;background:#ffffff15;border-radius:6px;padding:5px 8px;font-size:17px;line-height:1.2}li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xp{font-weight:800;color:#ffd29e}
</style>
<script src="./gta-overlay.js" defer></script>
</head>
<body>
<main class="card" aria-label="GTA giveaway" id="popup" hidden>
<h1>GTA 6 Giveaway</h1>
<p class="link">zeekfusion.com/gta-giveaway</p>
<h2>Standings</h2>
<p class="empty" id="empty" hidden></p>
<ol id="leaders" aria-label="Top five standings" hidden></ol>
</main>
</body>
</html>

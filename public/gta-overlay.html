<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeekFusion Giveaway · OBS Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;overflow:hidden;color:#fff4fa;font-family:Arial,system-ui,sans-serif}
.card{margin:10px;padding:20px 23px 18px;width:calc(100% - 20px);max-width:480px;border:1px solid #e28ab1;border-top:4px solid #ff9bbf;border-radius:20px;background:radial-gradient(ellipse at top right,#6f2850 0,transparent 63%),linear-gradient(130deg,#281632,#171222 70%);box-shadow:0 2px 8px #120718a0}
.tag{margin:0 0 7px;color:#ffb791;font-size:12px;letter-spacing:.16em;font-weight:800}
h1{font-size:35px;letter-spacing:-.05em;line-height:1;margin:0 0 7px;text-transform:uppercase;font-style:italic}
p{margin:0}.prize{color:#ffd29e;font-size:20px;font-weight:800}.status{font-size:15px;color:#f5c6df;margin-top:12px}.footer{margin-top:13px;color:#ffbfdb;font-size:15px;font-weight:700}
ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}ol[hidden]{display:none}li{display:grid;grid-template-columns:37px minmax(0,1fr) auto;gap:4px;align-items:center;background:#ffffff15;border-radius:6px;padding:5px 9px;font-size:16px}li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xp{font-weight:800;color:#ffd29e}.note{margin-top:4px;color:#f6cce1;font-size:13px}
</style>
<script src="./gta-overlay.js" defer></script>
</head>
<body>
<main class="card" aria-label="GTA giveaway">
<p class="tag">ZEEKFUSION • COMMUNITY GIVEAWAY</p>
<h1>GTA Leaderboard</h1>
<p class="prize">GTA 6 copy or gift card</p>
<p class="note">(If you don’t want it, it’ll be passed on to the next person.)</p>
<p class="status" id="status">Scoring hasn’t started yet.</p>
<ol id="leaders" hidden></ol>
<p class="footer">zeekfusion.com/#/gta-giveaway</p>
</main>
</body>
</html>

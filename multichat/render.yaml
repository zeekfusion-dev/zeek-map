services:
  - type: web
    name: zeekfusion-chat
    runtime: node
    plan: free
    rootDir: multichat
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STATE_URL
        sync: false
      - key: STATE_API_KEY
        sync: false
      - key: STATE_ACCESS_KEY
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false

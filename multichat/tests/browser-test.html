<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Multichat isolated browser reliability test</title>
  </head>
  <body>
    <h1>Isolated multichat test</h1>
    <p>
      Uses the production view code and real local WebSockets. Fixtures exercise
      all three platform normalizers; no public messages are sent.
    </p>
    <button id="run">Run three-minute independence test</button>
    <pre id="results">Ready</pre>
    <div style="display: flex; gap: 12px">
      <section>
        <h2>OBS (260px)</h2>
        <iframe
          id="obs"
          title="Test OBS"
          style="width: 260px; height: 500px"
          src="/overlay#browser-test-only"
        ></iframe>
      </section>
      <section>
        <h2>Reader (320px)</h2>
        <iframe
          id="reader"
          title="Test reader"
          style="width: 320px; height: 500px"
          src="/reader#browser-test-only"
        ></iframe>
      </section>
    </div>
    <script type="module" src="/browser-test.js"></script>
  </body>
</html>
